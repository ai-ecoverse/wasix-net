name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/node-ci.yml@v1.30.1
    with:
      chromium: false
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.83.0', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --component clippy --component rustfmt --target wasm32-wasip1 --target wasm32-wasip1-threads
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install MSRV
        if: matrix.toolchain == '1.83.0'
        run: rustup toolchain install 1.83.0 --profile minimal
      - name: Test
        run: cargo +${{ matrix.toolchain }} test --locked --features json
      - name: Format and lints
        if: matrix.toolchain == 'stable'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked --all-features --target wasm32-wasip1 -- -D warnings
          cargo clippy --locked --all-features --target wasm32-wasip1-threads -- -D warnings
      - name: Rehearse crate publication with a fresh registry cache
        if: matrix.toolchain == 'stable'
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-publish-dry-run
        run: |
          cargo fetch --locked
          node scripts/set-crate-version.mjs 0.1.2
          cargo update --offline -p wasix-net
          cargo publish --dry-run --locked --allow-dirty
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-wasip1, wasm32-wasip1-threads]
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --target wasm32-wasip1 --target wasm32-wasip1-threads
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Build
        run: cargo build --locked --release --features json --bin wasix-net-http --example nonblocking --target ${{ matrix.target }}
      - name: Kernel HTTP test
        env:
          WASIX_NET_HTTP_WASM: ${{ github.workspace }}/target/${{ matrix.target }}/release/wasix-net-http.wasm
        run: npm run test:kernel
