[package]
name = "wasix-net"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
description = "Loopback TCP sockets and a blocking HTTP/1.1 client for WASI programs in slicc's kernel"
repository = "https://github.com/ai-ecoverse/wasix-net"
homepage = "https://github.com/ai-ecoverse/wasix-net"
readme = "README.md"
keywords = ["wasi", "http", "tcp", "wasm", "proxy"]
categories = ["network-programming", "web-programming"]
publish = true
exclude = [
  ".github/",
  ".githooks/",
  "test/",
  "scripts/",
  "package.json",
  "package-lock.json",
  "lefthook.yml",
  "biome.json",
  "renovate.json",
  ".releaserc.json",
]

[features]
json = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "wasix-net-http"
path = "src/bin/wasix-net-http.rs"
required-features = ["json"]
